[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["deadlink*"]

[project]
name = "deadlink"
version = "0.1.0"
description = "Find broken links in Markdown files."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
deadlink = "deadlink.cli:main"